name: Market Intelligence Daily Pipeline & Pages Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:
  schedule:
    # 매일 한국 시간(KST) 오전 9시 = UTC 00:00 (0 0 * * *)
    - cron: '0 0 * * *'

# Grant GITHUB_TOKEN permissions required for Pages deployment and auto-commit
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Run Intelligence Pipeline (Collect -> Clean -> Recommend -> Build)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ENABLE_LLM_RELEVANCE: ${{ secrets.GEMINI_API_KEY != '' }}
        run: |
          python src/run_pipeline.py

      - name: ✅ Verify Static Site Artifacts
        run: |
          if [ ! -f "docs/index.html" ]; then
            echo "❌ Error: docs/index.html was not generated!"
            exit 1
          fi
          echo "✅ docs/index.html successfully verified."
          ls -lh docs/

      - name: 💾 Commit & Push Updated Intelligence Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/ logs/ || true
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(auto): daily market intelligence update [skip ci]"
            git push origin main || echo "Push skipped or failed"
          fi

      - name: 🌐 Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: 📦 Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
